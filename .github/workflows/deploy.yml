name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ...existing code...
      - name: Trigger cPanel Update and Deploy
        env:
          CPANEL_HOST: ${{ secrets.SSH_HOST }}
          CPANEL_USER: "ozfea"
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail

          API_BASE="https://$CPANEL_HOST:2083/execute/VersionControl"
          REPO_ROOT="%2fhome%2fozfea%2frepositories%2fnrk-next"

          call() {
            local path="$1"
            local attempt=1
            local max=3
            while [ $attempt -le $max ]; do
              echo "Calling: $API_BASE/$path?repository_root=$REPO_ROOT (attempt $attempt)"
              resp=$(curl -sS -w "\n%{http_code}" -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
                "$API_BASE/$path?repository_root=$REPO_ROOT" ) || true
              body=$(echo "$resp" | sed '$d')
              code=$(echo "$resp" | tail -n1)
              echo "HTTP $code"
              echo "Response body:"
              echo "$body"
              if [ "$code" = "200" ]; then
                return 0
              fi
              echo "Non-200 response. Retrying in 5s..."
              sleep 5
              attempt=$((attempt+1))
            done
            echo "Failed calling $path after $max attempts"
            return 1
          }

          # 1) pull/update repo on server
          call update

          # 2) trigger .cpanel.yml deployment tasks
          call deploy

          # 1. Force the Git Pull on the server
          curl -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
          "https://$CPANEL_HOST:2083/execute/VersionControl/update?repository_root=%2fhome%2fozfea%2frepositories%2fnrk-next"

          # 2. Trigger the deployment tasks (building the app)
          curl -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
          "https://$CPANEL_HOST:2083/execute/VersionControl/deploy?repository_root=%2fhome%2fozfea%2frepositories%2fnrk-next"
